# Relevé EN4.2.2 (Met Office) pour P9 : température et salinité 0-700 m sur les zones de Caesar et al. (2018).
# 127 archives annuelles (≈ 35 Go) lues une à une, rien n'est conservé que les moyennes de zone
# (data/sources/en4/en4-zones.csv). Une année déjà complète n'est pas relue.
# Déclenchement sur « push » limité au module du relevé et à ce fichier : un workflow ajouté sur une branche ne peut
# pas être lancé à la main avant d'être sur main. Mise à jour annuelle à décider à la clôture de P9.
name: EN4

on:
  push:
    paths:
      - "etl/sources/en4.py"
      - ".github/workflows/en4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: en4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Relevé EN4
        env:
          EN4_MAX_SECONDS: "19000"
        run: python -m etl.sources.en4
      - name: Publication
        if: always()
        run: |
          git config user.name "etl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/en4
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: relevé EN4 du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
