# Exécution mensuelle de l'ETL.
# Le commit des JSON mis à jour déclenche le redéploiement Vercel.
name: ETL mensuel

on:
  schedule:
    - cron: "17 4 5 * *"   # le 5 de chaque mois, 04:17 UTC (données du mois précédent disponibles)
  workflow_dispatch:
    inputs:
      only:
        description: "Identifiants à recalculer, séparés par des espaces (vide = tous)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write   # alerte de fraîcheur : etl/fraicheur.py ouvre une issue

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04   # épinglé : un changement d'OS ne doit pas modifier les résultats en silence
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt

      # Cache des téléchargements bruts : évite de retélécharger tout l'historique
      # à chaque exécution (quota Actions, charge sur les serveurs sources).
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: ETL
        shell: bash   # active pipefail : un ETL en échec reste en échec malgré tee
        env:
          ONLY: ${{ inputs.only }}   # passé par variable, jamais interpolé dans le script
        run: |
          if [ -n "$ONLY" ]; then
            # shellcheck disable=SC2086 — découpage voulu : plusieurs identifiants
            python -m etl.pipeline --only $ONLY 2>&1 | tee etl.log
          else
            python -m etl.pipeline 2>&1 | tee etl.log
          fi
      - name: Carte départementale (P5 bis)
        run: python -m etl.carte
      - run: python -m pytest etl/tests -q
      - run: python -m etl.validate
      - name: Validation de phase (critères docs/phases.md)
        run: |
          python -m etl.validation.p1
          python -m etl.validation.p2a
          python -m etl.validation.p2b
          python -m etl.validation.p3
          python -m etl.validation.p4
          python -m etl.validation.p5
          python -m etl.validation.p6
          python -m etl.validation.p7

      - name: Publication des résultats
        run: |
          git config user.name "etl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed docs/validation-p*-resultats.md
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: ETL du $(date -u +%Y-%m-%d)"
            git push
          fi

      # Après la publication : une alerte en échec ne doit pas empêcher de publier les données.
      - name: Fraîcheur (période commune, téléchargements en échec)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m etl.fraicheur --log etl.log --issues
