# Relevé quotidien des requêtes ERA5 (Copernicus Climate Data Store).
# Le CDS met plusieurs heures à traiter une requête : ce workflow ne l'attend jamais. Il relève les travaux aboutis,
# commite de petites séries extraites (data/sources/era5-pl) et soumet ce qui manque. L'ETL ne lit que ces CSV.
name: Copernicus

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "etl/sources/cds_era5.py"
      - ".github/workflows/copernicus.yml"

permissions:
  contents: write

concurrency:
  group: copernicus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Relevé et soumission
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}   # secret du dépôt, jamais affiché
        run: python -m etl.sources.cds_era5
      - name: Publication des séries extraites
        run: |
          git config user.name "etl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/era5-pl
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: relevé Copernicus du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
