# Contrôles à chaque push et pull request.
# Un JSON non conforme, un test rouge ou un site qui ne compile pas bloquent la fusion.
name: CI

on:
  push:
  pull_request:

jobs:
  etl:
    name: ETL — tests et validation des données
    runs-on: ubuntu-24.04   # épinglé : un changement d'OS ne doit pas modifier les résultats en silence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Tests unitaires
        run: python -m pytest etl/tests -q
      - name: Validation des JSON publiés (pydantic)
        run: python -m etl.validate

  web:
    name: Site — typage et build (validation zod)
    runs-on: ubuntu-24.04   # épinglé : un changement d'OS ne doit pas modifier les résultats en silence
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run sync-data
      - run: npm run typecheck
      - run: npm run build
