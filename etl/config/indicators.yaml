  # Catastrophes naturelles (arrêtés CatNat, base GASPAR)
  - id: catnat-gironde
    scale: gironde
    builder: etl.indicators.serie:build
    params: &catnat
      source: catnat-gironde
      scale: gironde
      variable: catnat
      place: {id: gironde, name: Gironde}
      where: En Gironde
      label: le nombre de reconnaissances de catastrophe naturelle
      title: Reconnaissances de catastrophe naturelle en Gironde (arrêtés CatNat)
      description: Nombre de reconnaissances de l'état de catastrophe naturelle (une commune, un arrêté, un péril) des communes de Gironde, classées par année de début de l'événement. Base GASPAR du ministère de la Transition écologique.
      limitations: &catnat-lims
      - 'Compte administratif, pas une mesure de l''aléa : il dépend des demandes des communes, de l''exposition (urbanisation, constructions sur argiles) et des critères de reconnaissance, modifiés plusieurs fois (notamment pour la sécheresse en 2000, 2018 et 2019).'
      - 'Un seul événement peut peser des centaines de reconnaissances (tempête de décembre 1999) : série très irrégulière.'
      - 'Les deux dernières années d''événement sont exclues : les reconnaissances, surtout de sécheresse, arrivent un à deux ans après (choix fixé avant calcul).'
