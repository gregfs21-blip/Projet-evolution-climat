  # --- « largeur d'abord », lot 2 (25/10/2026). Références fixées le 25/10/2026, avant tout calcul de ces indicateurs.
  # Température de la mer
  - id: sst-noaa-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: sst-noaa
      scale: monde
      variable: sst-noaa
      place: {id: monde, name: Monde}
      where: À l'échelle de l'océan mondial
      baseline: [1961, 1990]
      label: la température de surface de l'océan
      title: Température de surface de l'océan — NOAAGlobalTemp (NOAA)
      description: Anomalie annuelle de la température de surface de l'océan mondial, composante océanique de NOAAGlobalTemp (NOAA NCEI, à partir d'ERSST), ramenée à la moyenne 1961-1990 pour comparer les produits.
      limitations:
      - 'Avant 1950, mesures rares et faites au seau puis à la prise d''eau des navires : corrections de méthode importantes, incertitude forte au XIXe siècle.'
      reference: &sst-ref
        kind: difference
        base: [1850, 1900]
        period: [2011, 2020]
        range: [0.68, 1.01]
        unit: °C
        fixed_on: '2026-10-25'
        statement: 'GIEC AR6 GT1, chapitre 9 (résumé exécutif) : la température de surface de l''océan a augmenté de 0,88 °C [0,68 à 1,01] entre 1850-1900 et 2011-2020'
        source: GIEC AR6, groupe de travail I, chapitre 9
        url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-9/
  - id: sst-hadsst-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: hadsst
      scale: monde
      variable: sst-hadsst
      place: {id: monde, name: Monde}
      where: À l'échelle de l'océan mondial
      baseline: [1961, 1990]
      label: la température de surface de la mer
      title: Température de surface de la mer — HadSST 4.2 (Met Office)
      description: Anomalie annuelle de la température de surface de la mer, moyenne mondiale du produit HadSST 4.2 (Met Office Hadley Centre), par rapport à 1961-1990.
      limitations:
      - 'Moyenne des seules cases de grille observées, sans interpolation : couverture très incomplète avant 1950.'
      reference: *sst-ref
  - id: sst-gascogne-large-gironde
    scale: gironde
    enabled: false    # activé quand le relevé Copernicus aura les deux boîtes
    # P3 (27/10/2026) : ERA5 single levels via Copernicus, en remplacement d'OISST (serveur ERDDAP injoignable).
    builder: etl.indicators.mer:build
    params:
      box: sst-large-gironde
