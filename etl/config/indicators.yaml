  - id: banquise-arctique-septembre-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: nsidc-n09
      scale: monde
      variable: banquise-arctique-septembre
      place:
        id: monde
        name: Monde
      where: En Arctique
      label: l'étendue de la banquise de septembre
      title: Banquise arctique en septembre (minimum annuel)
      description: Étendue moyenne de la banquise arctique en septembre, mois du minimum annuel, mesurée par satellite (NSIDC).
      limitations:
      - Étendue (surface avec au moins 15 % de glace), pas épaisseur ni volume.
      reference:
        kind: relative_slope
        base:
        - 1981
        - 2010
        period:
        - 1979
        - 2024
        range:
        - -12.6
        - -11.6
        unit: '%/déc.'
        fixed_on: '2026-10-23'
        statement: 'NSIDC : −12,1 % par décennie par rapport à la moyenne 1981-2010, entre 1979 et 2024 (régression linéaire ; tolérance ±0,5 point)'
        source: NOAA Climate.gov, d'après le NSIDC
        url: https://www.climate.gov/news-features/understanding-climate/climate-change-minimum-Arctic-sea-ice-extent
  - id: banquise-antarctique-fevrier-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: nsidc-s02
      scale: monde
      variable: banquise-antarctique-fevrier
      place:
        id: monde
        name: Monde
      where: En Antarctique
      label: l'étendue de la banquise de février
      title: Banquise antarctique en février (minimum annuel)
      description: Étendue moyenne de la banquise antarctique en février, mois du minimum annuel, mesurée par satellite (NSIDC).
      limitations:
      - Étendue, pas épaisseur ; forte variabilité d'une année à l'autre, et records bas récents après une longue période stable.
  - id: oni-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: oni
      scale: monde
      variable: oni
      place:
        id: monde
        name: Monde
      where: Dans le Pacifique équatorial
      label: l'indice El Niño annuel moyen
      title: 'El Niño : indice ONI, moyenne annuelle'
      description: 'Moyenne annuelle de l''indice océanique El Niño (ONI, NOAA CPC) : écart de température de surface de la mer dans la région Niño 3.4.'
      limitations:
      - 'L''ONI est calculé par rapport à des périodes de base de 30 ans mises à jour tous les 5 ans : il retire en partie le réchauffement de fond, ce qui est voulu pour suivre El Niño mais exclut d''y lire
        une tendance climatique.'
      - 'Moyenne annuelle : lisse les épisodes, qui se comptent normalement en saisons.'
  - id: niveau-mer-brest
    scale: france
    builder: etl.indicators.serie:build
    params:
      source: psmsl-1
      scale: france
      variable: niveau-mer
      place:
        id: brest
        name: Brest
        kind: station
      where: À Brest
      baseline: series
      station:
        id: PSMSL-1
        name: Brest
        lat: 48.38285
        lon: -4.494838
      label: le niveau marin moyen
      title: Niveau marin à Brest
      description: Niveau marin moyen annuel au marégraphe de Brest (PSMSL, référence locale révisée), en écart à la moyenne de la série.
      limitations:
      - 'Niveau relatif : il inclut les mouvements verticaux du sol (subsidence ou soulèvement), pas seulement la hausse des océans.'
      - Années signalées douteuses par le PSMSL écartées ; aucune valeur complétée.
      reference:
        kind: rate
        period:
        - 1901
        - 1971
        range:
        - 0.6
        - 2.1
        unit: mm/an
        fixed_on: '2026-10-23'
        statement: 'GIEC AR6 (SPM A.1.7) : hausse du niveau marin moyen mondial de 1,3 mm/an [0,6 à 2,1] entre 1901 et 1971 (référence mondiale appliquée à un marégraphe)'
        source: GIEC, 6e rapport, groupe I, résumé pour décideurs
        url: https://www.ipcc.ch/report/ar6/wg1/chapter/summary-for-policymakers/
