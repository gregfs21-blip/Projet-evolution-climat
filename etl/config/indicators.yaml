      where: À l'échelle du globe
      baseline:
      - 1961
      - 1990
      label: la température moyenne de surface
      title: Température globale — Berkeley Earth
      description: Anomalie annuelle de la température moyenne de surface (terres et océans), produit Berkeley Earth, ramenée à la moyenne 1961-1990 pour comparer les produits.
      limitations:
      - 'Anomalie globale : moyenne de mesures terrestres et marines, interpolées là où les observations manquent (pôles, océans du Sud, XIXe siècle).'
      reference:
        kind: difference
        base:
        - 1850
        - 1900
        period:
        - 2011
        - 2020
        range:
        - 0.95
        - 1.2
        unit: °C
        fixed_on: '2026-10-23'
        statement: 'GIEC AR6 (SPM A.1.2) : 2011-2020 plus chaud de 1,09 °C [0,95 à 1,20] que 1850-1900'
        source: GIEC, 6e rapport, groupe I, résumé pour décideurs
        url: https://www.ipcc.ch/report/ar6/wg1/chapter/summary-for-policymakers/
