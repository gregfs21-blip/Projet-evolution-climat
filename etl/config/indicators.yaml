  - id: tx-annuelle-cazaux
    scale: gironde
    builder: etl.indicators.temperature:build_station
    params: {variable: TX, station: cazaux}
  - id: tx-annuelle-villenave-d-ornon
    scale: gironde
    builder: etl.indicators.temperature:build_station
    params: {variable: TX, station: villenave-d-ornon}
  # --- P1 : TM par station
  - id: tm-annuelle-bordeaux-paulin
    scale: gironde
    builder: etl.indicators.temperature:build_station
    params: {variable: TM, station: bordeaux-paulin}
  - id: tm-annuelle-cap-ferret
