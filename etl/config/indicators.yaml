      title: Température de surface de la mer au large de la Gironde (ERA5)
      description: Moyenne annuelle de la température de surface de la mer entre 44 et 46° N et entre 3 et 1° O, au large de la Gironde (réanalyse ERA5, Copernicus).
  - id: niveau-mer-large-gironde
    scale: gironde
