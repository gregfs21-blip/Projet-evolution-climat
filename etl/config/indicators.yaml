      title: Température de surface du golfe de Gascogne (ERA5)
      description: Moyenne annuelle de la température de surface de la mer sur le golfe de Gascogne (43,5-48° N, 10-1° O), réanalyse ERA5 (Copernicus). Porte la référence publiée de + 0,26 °C par décennie depuis 1982.
  # Ouragans de l'Atlantique Nord
  - id: ouragans-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: ibtracs-ouragans
      scale: monde
      variable: ouragans
      place: {id: monde, name: Atlantique Nord}
      where: Dans l'Atlantique Nord
      label: le nombre d'ouragans par saison
      title: Nombre d'ouragans par saison dans l'Atlantique Nord (IBTrACS)
      description: Nombre de systèmes tropicaux ayant atteint au moins la catégorie 1 de l'échelle de Saffir-Simpson (vent soutenu ≥ 64 nœuds) au cours de la saison, d'après IBTrACS (NOAA NCEI), trajectoires principales.
      limitations:
      - 'Série limitée à l''ère satellitaire (depuis 1966, choix fixé avant calcul) : avant, des ouragans de haute mer échappaient à l''observation.'
      - 'L''Atlantique Nord ne représente qu''environ un huitième des cyclones tropicaux du globe ; sa variabilité multidécennale (oscillation atlantique) pèse lourd sur une tendance depuis les années 1970.'
      - 'La saison en cours est exclue.'
      reference:
        kind: mean
        period: [1991, 2020]
        range: [6.5, 7.5]
        unit: ouragans par saison
        fixed_on: '2026-10-25'
        statement: 'NOAA (communiqué du 9 avril 2021) : moyenne 1991-2020 de 7 ouragans par saison atlantique (valeur arrondie à l''unité, d''où la fourchette 6,5 à 7,5)'
        source: NOAA, nouvelles moyennes de la saison des ouragans atlantiques
        url: https://www.noaa.gov/media-release/average-atlantic-hurricane-season-to-reflect-more-storms
  - id: ace-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: ibtracs-ace
      scale: monde
      variable: ace
      place: {id: monde, name: Atlantique Nord}
      where: Dans l'Atlantique Nord
      label: l'énergie cumulée des cyclones (ACE)
      title: Énergie cumulée des cyclones (ACE) dans l'Atlantique Nord (IBTrACS)
      description: Somme, sur la saison, des carrés du vent soutenu maximal (en nœuds, divisée par 10 000) relevé toutes les 6 heures pour chaque tempête tropicale ou ouragan. Mesure à la fois le nombre, la durée et l'intensité des cyclones.
      limitations:
      - 'Série limitée à l''ère satellitaire (depuis 1966, choix fixé avant calcul) ; la saison en cours est exclue.'
      - 'Calcul fait ici à partir des trajectoires IBTrACS : peut différer de quelques unités des valeurs officielles de la NOAA (définition des systèmes subtropicaux).'
