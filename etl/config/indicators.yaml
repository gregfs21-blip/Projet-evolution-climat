      limitations:
      - 'Anomalie globale : moyenne de mesures terrestres et marines, interpolées là où les observations manquent (pôles, océans du Sud, XIXe siècle).'
  - id: ohc-700-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: ohc-700
      scale: monde
      variable: ohc-700
      place:
        id: monde
        name: Monde
      where: Dans l'océan mondial
      label: le contenu thermique entre 0 à 700 m
      title: Chaleur de l'océan mondial, 0 à 700 m
      description: Contenu thermique de l'océan mondial entre 0 à 700 m de profondeur, moyenne annuelle (NOAA NCEI), en écart à la référence du producteur.
      limitations:
      - 'Couverture des mesures très inégale avant le réseau Argo (années 2000) : incertitude plus forte sur les premières décennies.'
  - id: ohc-2000-monde
