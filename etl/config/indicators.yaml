  # --- « largeur d'abord » (décision de Grég du 23/10/2026) : une série par paramètre.
  # Chaque référence est fixée ici, dans ce commit, AVANT le premier calcul de l'indicateur.
  - id: co2-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: co2-gl
      scale: monde
      variable: co2
      place:
        id: monde
        name: Monde
      where: En moyenne mondiale
      label: la concentration de CO₂
      title: Dioxyde de carbone (CO₂), moyenne mondiale
      description: Moyenne annuelle de la fraction molaire de CO₂ dans l'air de surface marine, réseau mondial de la NOAA.
      limitations:
      - 'Concentration atmosphérique : une cause du réchauffement, pas une mesure du climat lui-même.'
      reference:
        kind: rate
        period:
        - 2010
        - 2019
        range:
        - 2.14
        - 2.62
        unit: ppm/an
        fixed_on: '2026-10-23'
        statement: 'NOAA : croissance annuelle du CO₂ global 2010-2019, moyenne des taux publiés 2,38 ppm/an (tolérance ±10 %, définitions voisines)'
        source: NOAA GML, taux de croissance annuels du CO₂ global
        url: https://gml.noaa.gov/ccgg/trends/gl_gr.html
  - id: ch4-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: ch4-gl
      scale: monde
      variable: ch4
      place:
        id: monde
        name: Monde
      where: En moyenne mondiale
      label: la concentration de méthane
      title: Méthane (CH₄), moyenne mondiale
      description: Moyenne annuelle de la fraction molaire de méthane dans l'air de surface marine, réseau mondial de la NOAA.
      limitations:
      - 'Concentration atmosphérique : une cause du réchauffement, pas une mesure du climat lui-même.'
      reference:
        kind: rate
        period:
        - 2010
        - 2019
        range:
        - 6.82
        - 8.34
        unit: ppb/an
        fixed_on: '2026-10-23'
        statement: 'NOAA : croissance annuelle du méthane 2010-2019, moyenne des taux publiés 7,58 ppb/an (tolérance ±10 %)'
        source: NOAA GML, taux de croissance annuels du méthane global
        url: https://gml.noaa.gov/ccgg/trends_ch4/
  - id: n2o-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: n2o-gl
      scale: monde
      variable: n2o
      place:
        id: monde
        name: Monde
      where: En moyenne mondiale
      label: la concentration de protoxyde d'azote
      title: Protoxyde d'azote (N₂O), moyenne mondiale
      description: Moyenne annuelle de la fraction molaire de N₂O dans l'air de surface marine, réseau mondial de la NOAA.
      limitations:
      - 'Concentration atmosphérique : une cause du réchauffement, pas une mesure du climat lui-même.'
  - id: temperature-hadcrut5-monde
    scale: monde
    builder: etl.indicators.serie:build
    params:
      source: hadcrut5
      scale: monde
      variable: temperature-hadcrut5
      place:
        id: monde
        name: Monde
      where: À l'échelle du globe
      baseline:
      - 1961
      - 1990
      label: la température moyenne de surface
      title: Température globale — HadCRUT5 (Met Office, CRU)
      description: Anomalie annuelle de la température moyenne de surface (terres et océans), produit HadCRUT5 (Met Office, CRU), ramenée à la moyenne 1961-1990 pour comparer les produits.
      limitations:
      - 'Anomalie globale : moyenne de mesures terrestres et marines, interpolées là où les observations manquent (pôles, océans du Sud, XIXe siècle).'
      reference:
        kind: difference
        base:
        - 1850
        - 1900
        period:
        - 2011
        - 2020
        range:
        - 0.95
        - 1.2
        unit: °C
        fixed_on: '2026-10-23'
        statement: 'GIEC AR6 (SPM A.1.2) : 2011-2020 plus chaud de 1,09 °C [0,95 à 1,20] que 1850-1900'
        source: GIEC, 6e rapport, groupe I, résumé pour décideurs
        url: https://www.ipcc.ch/report/ar6/wg1/chapter/summary-for-policymakers/
  - id: temperature-berkeley-monde
    scale: monde
    builder: etl.indicators.serie:build
