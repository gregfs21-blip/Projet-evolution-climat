# Vocabulaire des variables : une entrée par grandeur, quel que soit le lieu.
# C'est la seule définition des libellés : le site les lit dans les JSON et n'en connaît aucun à l'avance.
# `theme` regroupe des variables comparables (même unité de tendance) sur une même matrice, carte, superposition.
# `order` fixe le rang d'affichage dans le thème.

themes:
  temperature: Températures annuelles
  extremes-temperature: Extrêmes de température
  precipitations: Précipitations
  ensoleillement: Ensoleillement
  niveau-mer: Niveau de la mer
  temperature-globale: Température globale
  ges: Gaz à effet de serre
  chaleur-ocean: Chaleur des océans
  banquise: Banquise
  enso: El Niño
  temperature-mer: Température de la mer
  ouragans: Ouragans de l'Atlantique Nord
  vent: Vent et tempêtes
  pression: Pression atmosphérique
  humidite: Humidité de l'air
  altitude: Température en altitude
  geopotentiel: Géopotentiel
  catastrophes: Catastrophes naturelles (arrêtés CatNat)
  jet-stream: Jet stream (Atlantique Nord, hiver)
  pluies-intenses: Pluies intenses
  secheresse: Demande en eau et sécheresse
  viticulture: Viticulture
  sante: Santé (chaleur)
  incendie: Danger météo d'incendie

variables:
  tn: {code: TN, label: températures minimales, theme: temperature, order: 0}
  tm: {code: TM, label: températures moyennes, theme: temperature, order: 1}
  tx: {code: TX, label: températures maximales, theme: temperature, order: 2}

# --- P2a : extrêmes de température (comptages annuels de jours, unité « jours »)
  jours-tx25: {code: TX ≥ 25, label: journées estivales (TX ≥ 25 °C), theme: extremes-temperature, order: 0}
  jours-tx30: {code: TX ≥ 30, label: journées chaudes (TX ≥ 30 °C), theme: extremes-temperature, order: 1}
  jours-tx35: {code: TX ≥ 35, label: journées très chaudes (TX ≥ 35 °C), theme: extremes-temperature, order: 2}
  nuits-tn20: {code: TN ≥ 20, label: nuits tropicales (TN ≥ 20 °C), theme: extremes-temperature, order: 3}
  jours-gel: {code: TN ≤ 0, label: jours de gel (TN ≤ 0 °C), theme: extremes-temperature, order: 4}

# --- « largeur d'abord » (23/10/2026) : une série par paramètre
  rr-cumul: {code: RR, label: précipitations annuelles, theme: precipitations, order: 0}
  insolation: {code: INS, label: durée d'ensoleillement annuelle, theme: ensoleillement, order: 0}
  niveau-mer: {code: NM, label: niveau marin moyen annuel, theme: niveau-mer, order: 0}
  temperature-hadcrut5: {code: HadCRUT5, label: température globale (HadCRUT5), theme: temperature-globale, order: 0}
  temperature-gistemp: {code: GISTEMP, label: température globale (GISTEMP), theme: temperature-globale, order: 1}
  temperature-berkeley: {code: Berkeley, label: température globale (Berkeley Earth), theme: temperature-globale, order: 2}
  co2: {code: CO₂, label: dioxyde de carbone, theme: ges, order: 0}
  ch4: {code: CH₄, label: méthane, theme: ges, order: 1}
  n2o: {code: N₂O, label: protoxyde d'azote, theme: ges, order: 2}
  ohc-700: {code: 0-700 m, label: chaleur de l'océan entre 0 et 700 m, theme: chaleur-ocean, order: 0}
  ohc-2000: {code: 0-2000 m, label: chaleur de l'océan entre 0 et 2000 m, theme: chaleur-ocean, order: 1}
  banquise-arctique-septembre: {code: Arctique, label: banquise arctique en septembre, theme: banquise, order: 0}
  banquise-antarctique-fevrier: {code: Antarctique, label: banquise antarctique en février, theme: banquise, order: 1}
  oni: {code: ONI, label: "indice El Niño (ONI), moyenne annuelle", theme: enso, order: 0}

# --- « largeur d'abord », lot 2 (25/10/2026)
  sst-noaa: {code: NOAA, label: température de surface de l'océan mondial (NOAAGlobalTemp), theme: temperature-mer, order: 0}
  sst-hadsst: {code: HadSST, label: température de surface de l'océan mondial (HadSST), theme: temperature-mer, order: 1}
  sst-gascogne: {code: Gironde, label: température de surface de la mer au large de la Gironde, theme: temperature-mer, order: 2}
  sst-golfe: {code: Golfe, label: température de surface du golfe de Gascogne, theme: temperature-mer, order: 3}
  ouragans: {code: Ouragans, label: nombre d'ouragans par saison, theme: ouragans, order: 0}
  ace: {code: ACE, label: énergie cumulée des cyclones (ACE), theme: ouragans, order: 1}
  jours-vent-fort: {code: Vent fort, label: "jours de vent fort (rafale ≥ 57,6 km/h)", theme: vent, order: 0}
  rafale-max: {code: Rafale max, label: rafale maximale de l'année, theme: vent, order: 1}
  jours-tempete: {code: Rafale ≥ 100, label: jours de tempête (rafale ≥ 100 km/h), theme: vent, order: 2}
  pression: {code: PMER, label: pression moyenne au niveau de la mer, theme: pression, order: 0}
  humidite: {code: HR, label: humidité relative moyenne, theme: humidite, order: 0}
  t850: {code: T850, label: température à 850 hPa (environ 1 500 m), theme: altitude, order: 0}
  t500: {code: T500, label: température à 500 hPa (environ 5 500 m), theme: altitude, order: 1}
  z500: {code: Z500, label: altitude de la surface 500 hPa (géopotentiel), theme: geopotentiel, order: 0}
  catnat: {code: CatNat, label: reconnaissances de catastrophe naturelle, theme: catastrophes, order: 0}
  catnat-secheresse: {code: Sécheresse, label: reconnaissances CatNat « sécheresse », theme: catastrophes, order: 1}

# --- ERA5 niveaux de pression (Copernicus CDS, 26/10/2026)
  jet-vitesse: {code: Vitesse, label: "vitesse du jet stream en hiver (850 hPa)", theme: jet-stream, order: 0}
  jet-latitude: {code: Latitude, label: "latitude du jet stream en hiver (850 hPa)", theme: jet-stream, order: 1}
# --- P2b (critères validés le 26/10/2026)
  r10mm: {code: RR ≥ 10, label: "jours de pluie ≥ 10 mm", theme: pluies-intenses, order: 0}
  r20mm: {code: RR ≥ 20, label: "jours de pluie ≥ 20 mm", theme: pluies-intenses, order: 1}
  rx1day: {code: RX1j, label: "pluie maximale en un jour", theme: pluies-intenses, order: 2}
  rx5day: {code: RX5j, label: "pluie maximale en cinq jours", theme: pluies-intenses, order: 3}
  etp: {code: ETP, label: "évapotranspiration potentielle (Hargreaves)", theme: secheresse, order: 0}
  bilan-hydrique: {code: P − ETP, label: "bilan climatique pluie − ETP", theme: secheresse, order: 1}
  spei12: {code: SPEI-12, label: "indice de sécheresse SPEI à 12 mois", theme: secheresse, order: 2}
  mois-secs: {code: Mois secs, label: "mois secs (SPEI-3 ≤ −1)", theme: secheresse, order: 3}
# --- P4 (critères I1-I9 validés le 28/10/2026)
  huglin: {code: Huglin, label: "indice de Huglin (chaleur utile à la vigne, avril-septembre)", theme: viticulture, order: 0}
  fraicheur-nuits: {code: Nuits sept., label: "température minimale moyenne de septembre (fraîcheur des nuits)", theme: viticulture, order: 1}
  gelees-tardives: {code: Gel tardif, label: "jours de gelée tardive (TN ≤ 0 °C, 1er avril-15 mai)", theme: viticulture, order: 2}
  vendanges: {code: Vendanges, label: "date de début des vendanges (jours après le 31 août)", theme: viticulture, order: 3}
  canicule: {code: Canicule, label: "jours de canicule (seuils de la Gironde, 21 °C et 35 °C sur 3 jours)", theme: sante, order: 0}
  catnat-inondation: {code: Inondation, label: reconnaissances CatNat « inondation », theme: catastrophes, order: 2}
  catnat-vagues: {code: Vagues, label: reconnaissances CatNat « chocs mécaniques des vagues », theme: catastrophes, order: 3}
  fwi-ete: {code: FWI été, label: "indice forêt-météo moyen de juin à septembre (FWI)", theme: incendie, order: 0}
  jours-fwi: {code: "FWI ≥ 21,3", label: "jours de danger météo d'incendie très élevé (FWI ≥ 21,3)", theme: incendie, order: 1}
